name: Generate China Show Briefing

on:
  schedule:
    - cron: '30 4 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser anthropic youtube-transcript-api mcp-elevenreader

      - name: Run briefing generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVEN_REFRESH_TOKEN: ${{ secrets.ELEVEN_REFRESH_TOKEN }}
        run: python generate_briefing.py

      - name: Save processed episode ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_ids.txt
          git diff --staged --quiet || git commit -m "Mark episode processed"
          git push
